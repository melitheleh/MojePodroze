# Analiza statyczna backendu w lokalnym SonarQube (http://localhost:9000).
# Skaner uruchamiamy z katalogu backend/ (baza projektu), patrz README → „SonarQube”.
# Frontend dostanie w kolejnej fazie własny projekt (frontend/sonar-project.properties).

sonar.projectKey=moje-podroze-backend
sonar.projectName=Moje podróże – backend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=app,migrations
sonar.tests=tests
sonar.python.version=3.13

# Raporty generowane przed skanem:
#   pytest --cov --cov-report=xml --junitxml=test-results.xml
#   ruff check --output-format=json --exit-zero -o ruff-report.json
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.python.ruff.reportPaths=ruff-report.json

# Migracje są generowane przez Alembica: bez wymagań pokrycia i wykrywania duplikatów.
sonar.coverage.exclusions=migrations/**
sonar.cpd.exclusions=migrations/**
