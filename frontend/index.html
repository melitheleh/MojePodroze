<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Yellowtail&display=swap"
    />
    <title>Moje podróże</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Motyw przed pierwszym rysowaniem (bez mignięcia jasnego widoku): zapisany wybór albo ustawienie systemu -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark" && theme !== "contrast") {
          theme = matchMedia("(prefers-contrast: more)").matches
            ? "contrast"
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
